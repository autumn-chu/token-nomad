version = 1
selector = "tui"

# Omit selector for the native TUI default. Use "builtin" for the legacy fixed-control selector or "fzf" when fzf is installed.

[endpoints.official]
auth = "native"

[profiles.review]
agent = "claude"
endpoint = "official"
label = "Review"
description = "Review the current change"
tags = ["review"]

[profiles.implementation]
agent = "codex"
endpoint = "official"
label = "Implementation"
description = "Implement the selected change"
tags = ["build"]

[keybindings.tui]
# Plain typing remains search and Ctrl-C always cancels.
accept = "enter"
cancel = "esc"
previous = "up"
next = "down"
toggle_preview = "ctrl-p"
preview_below = "ctrl-/"
preview_right = "alt-/"
choose_agent = "ctrl-l"
choose_endpoint = "ctrl-e"
help = "f1"
