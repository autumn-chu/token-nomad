name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package archive
        env:
          ARCHIVE: token-nomad-${{ runner.os }}-${{ runner.arch }}.tar.gz
        run: tar -czf "$ARCHIVE" -C target/release nomad -C "$GITHUB_WORKSPACE" LICENSE README.md
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: token-nomad-${{ runner.os }}-${{ runner.arch }}
          path: token-nomad-${{ runner.os }}-${{ runner.arch }}.tar.gz
