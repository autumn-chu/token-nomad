name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - name: Install fzf and jq on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fzf jq
      - name: Install fzf and jq on macOS
        if: runner.os == 'macOS'
        run: |
          brew list fzf >/dev/null 2>&1 || brew install fzf
          brew list jq >/dev/null 2>&1 || brew install jq
      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          fzf --version
          jq --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features --locked
